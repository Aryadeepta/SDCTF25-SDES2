[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sdes2-integer-reconstruction"
version = "0.1.0"
description = "Integer reconstruction from an SDCTF 2025 cryptography challenge"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
sdes2-demo = "sdes2.demo:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sdes2"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
